name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag voice-bot:ci .
      - name: Check container setup without API calls
        run: >-
          docker run --rm --network none
          -e TELEGRAM_BOT_TOKEN=123456:test-token
          -e OPENAI_API_KEY=test-openai-key
          -e OWNER_ID=1
          voice-bot:ci voice-bot --check

